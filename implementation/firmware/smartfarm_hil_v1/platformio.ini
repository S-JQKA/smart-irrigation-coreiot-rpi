[platformio]
default_envs = bridge_usb

[env]
platform = espressif32
framework = arduino
lib_deps = bblanchon/ArduinoJson@^7.2.1
monitor_speed = 115200
upload_speed = 921600

[env:sensor_node]
board = esp32-s3-devkitc-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSMARTFARM_ROLE_SENSOR=1
    -DSMARTFARM_SENSOR_FIELD=1

[env:sensor_field1_n16r8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSMARTFARM_ROLE_SENSOR=1
    -DSMARTFARM_SENSOR_FIELD=1

[env:sensor_field2_n16r8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSMARTFARM_ROLE_SENSOR=1
    -DSMARTFARM_SENSOR_FIELD=2

[env:bridge_usb]
board = freenove_esp32_s3_wroom
build_flags =
    -DSMARTFARM_ROLE_BRIDGE=1

[env:central_led]
board = esp32-s3-devkitc-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSMARTFARM_ROLE_CENTRAL=1
    -DSMARTFARM_VALVE1_PIN=48
    -DSMARTFARM_VALVE2_PIN=4
    -DSMARTFARM_PUMP_PIN=47
    -DSMARTFARM_MAX_CONCURRENT_ZONES=2
